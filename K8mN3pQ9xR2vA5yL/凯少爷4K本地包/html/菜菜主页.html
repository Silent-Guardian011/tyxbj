<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>菜菜🥬主页</title>
    <style>
        :root {
            --panel-rgb: 42, 50, 58;
            --panel: rgba(var(--panel-rgb), .62);
            --panel-soft: rgba(var(--panel-rgb), .44);
            --panel-strong: rgba(var(--panel-rgb), .86);
            --line: rgba(255, 255, 255, .16);
            --text: #f7fbff;
            --muted: rgba(247, 251, 255, .68);
            --accent: #ff6b35;
            --accent2: #ffb86b;
            --bad: #ff5c7a;
            --ok: #68e39a;
            --radius: 18px;
            --shadow: 0 18px 50px rgba(0, 0, 0, .28)
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            /* 新背景：从目标网站提取的深色渐变 + 动态光影 */
            background: linear-gradient(135deg, #0b0e14 0%, #1a1f2b 40%, #14181f 100%);
            background-attachment: fixed;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif
        }

        /* 增加一个微妙的动态光晕效果 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 107, 53, .06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(255, 184, 107, .04) 0%, transparent 50%);
            animation: auraPulse 12s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes auraPulse {
            0% {
                opacity: 0.6;
                transform: scale(1) rotate(0deg);
            }
            100% {
                opacity: 1;
                transform: scale(1.05) rotate(3deg);
            }
        }

        .app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 10px 10px 28px
        }

        .top {
            position: relative;
            z-index: 1;
            padding: 8px 0 10px;
            border-bottom: 0
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .brand {
            flex: 0 0 auto;
            font-size: 21px;
            font-weight: 900;
            letter-spacing: .5px;
            text-shadow: 0 2px 14px rgba(0, 0, 0, .35)
        }

        .brand b {
            color: var(--accent2)
        }

        .search {
            flex: 1;
            display: flex;
            gap: 8px;
            min-width: 0;
            align-items: center;
            background: rgba(255, 255, 255, .10);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 999px;
            padding: 6px 7px 6px 13px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05)
        }

        .search input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--text);
            font-size: 15px
        }

        .search input::placeholder {
            color: var(--muted)
        }

        button,
        .btn {
            border: 1px solid var(--line);
            background: var(--panel-soft);
            color: var(--text);
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer
        }

        .btn.primary,
        button.primary {
            border-color: rgba(255, 107, 53, .45);
            background: linear-gradient(135deg, rgba(255, 107, 53, .90), rgba(255, 184, 107, .72));
            color: #ffffff;
            font-weight: 800
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow: auto;
            padding: 10px 2px 0;
            scrollbar-width: none
        }

        .tabs::-webkit-scrollbar {
            display: none
        }

        .tab {
            white-space: nowrap;
            border-radius: 999px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            flex-shrink: 0;
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(255, 107, 53, .55), rgba(255, 184, 107, .30));
            color: var(--text);
            border-color: rgba(255, 184, 107, .58);
            font-weight: 800
        }

        .status {
            margin: 10px 2px;
            color: var(--muted);
            font-size: 14px;
            min-height: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px
        }

        .card {
            position: relative;
            min-width: 0;
            border-radius: 15px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .045));
            border: 1px solid rgba(255, 255, 255, .12);
            box-shadow: 0 10px 28px rgba(0, 0, 0, .22);
            cursor: pointer;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent2);
        }

        .card .name {
            font-weight: 800;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card .name .tag {
            font-size: 10px;
            background: var(--accent);
            color: #fff;
            padding: 0 8px;
            border-radius: 999px;
            font-weight: 700;
            white-space: nowrap;
        }

        .card .remark {
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card .icon-box {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .section {
            margin: 16px 0
        }
        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 2px 10px
        }
        .section-title h2 {
            margin: 0;
            font-size: 17px;
            letter-spacing: .3px
        }

        /* Detail Sheet */
        .sheet {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: none;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            overflow: hidden;
            align-items: flex-end;
            justify-content: center;
        }
        .sheet.active {
            display: flex;
        }
        .sheet-inner {
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            padding: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .detail-panel {
            background: linear-gradient(135deg, rgba(64, 35, 30, .92), rgba(30, 24, 24, .94));
            border: 1px solid rgba(255, 255, 255, .10);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 20px 16px 28px;
            margin-bottom: 20px;
            touch-action: pan-y;
        }
        .detail-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 12px;
            color: rgba(255,255,255,.94);
            word-break: break-all;
        }
        .detail-desc {
            color: rgba(255,255,255,.7);
            font-size: 16px;
            line-height: 1.7;
            margin: 8px 0 20px;
        }
        .detail-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .detail-actions .btn {
            flex: 1;
            min-width: 100px;
            text-align: center;
            padding: 12px 16px;
            border-radius: 999px;
            font-weight: 700;
            background: rgba(255,255,255,.08);
            border: 1px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font-size: 16px;
        }
        .detail-actions .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .detail-actions .btn.copy-btn {
            background: rgba(255,184,107,.2);
            border-color: var(--accent2);
        }
        .empty {
            padding: 30px 18px;
            text-align: center;
            color: var(--muted);
            background: var(--panel-soft);
            border: 1px dashed var(--line);
            border-radius: var(--radius)
        }
        .focusable:focus,
        .card:focus,
        button:focus,
        .tab:focus,
        input:focus {
            outline: 2px solid rgba(255, 184, 107, .76);
            outline-offset: 2px;
        }

        #closeDetail {
            margin: 0 0 12px 0;
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 184, 107, .55);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        @media (min-width:720px) {
            .grid {
                grid-template-columns: repeat(4, minmax(0, 1fr))
            }
            .app {
                padding: 18px 28px 44px
            }
        }
        @media (min-width:1100px) {
            .grid {
                grid-template-columns: repeat(5, minmax(0, 1fr))
            }
            .app {
                max-width: 1380px;
                margin: 0 auto
            }
        }
        @media (max-width:480px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }
            .brand {
                font-size: 18px
            }
            .search input {
                font-size: 13px
            }
            .detail-panel {
                padding: 16px 12px;
            }
        }
        /* toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-strong);
            color: #fff;
            padding: 10px 24px;
            border-radius: 999px;
            border: 1px solid var(--line);
            font-size: 14px;
            z-index: 99;
            backdrop-filter: blur(4px);
            display: none;
        }
        .toast.show {
            display: block;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>

                { id: 58, category: 'tools', title: '下次一定', desc: '只为白嫖', url: 'https://www.iiice.cn/#/', icon: '👀' },
                { id: 59, category: 'tools', title: 'IPTV 直播源', desc: '直播源', url: 'https://jiandantv.com', icon: '📡' },
                { id: 60, category: 'tools', title: '瓜子', desc: '官方下载地址', url: 'http://gz857.com/', icon: '🥜' },
                { id: 61, category: 'tools', title: '网飞猫', desc: '一起看更好的世界', url: 'https://dl.ncat21.com/', icon: '🐱' },
                { id: 62, category: 'tools', title: '影视森林', desc: '观影第一站', url: 'http://www.549.tv/?ref=www.zjnav.com/', icon: '🌳' },
                { id: 63, category: 'tools', title: '诺影导航', desc: '让观影更畅快', url: 'https://nuoin.com/', icon: '🧭' },
                { id: 64, category: 'tools', title: '全都有资源站', desc: '各种模板', url: 'https://www.douyouvip.com/', icon: '🎁' },
                { id: 65, category: 'tools', title: 'Netlify', desc: '静态网站托管服务平台', url: 'https://www.netlify.com/', icon: '⚙️' },
                { id: 66, category: 'tools', title: '深度科技', desc: '深度，值得深入', url: 'https://www.deepinghost.com/', icon: '🧊' },
                { id: 67, category: 'tools', title: 'U深度', desc: '新一代U盘启动盘制作工具', url: 'http://ushendu.ycouqim.cn/', icon: '💾' },
                { id: 68, category: 'tools', title: '老毛桃', desc: 'U盘启动盘制作工具', url: 'https://www.laomaotao.net/', icon: '🍑' },
                { id: 69, category: 'tools', title: 'Linux论坛', desc: '非常活跃、新潮的社区', url: 'https://linux.do/', icon: '🐧' },
                { id: 70, category: 'tools', title: '采集资源', desc: '影视站长技术交流圈', url: 'https://www.yszzq.com/', icon: '📚' },
                { id: 71, category: 'tools', title: '直播源格式转换', desc: '直播源格式在线转换工具', url: 'https://guihet.com/tvlistconvert.html#zbyjg', icon: '🔄' },
            ];

            // 分类配置
            const CATEGORIES = [
                { key: 'all', label: '🏠 全部' },
                { key: 'tvbox', label: '📺 TVbox接口' },
                { key: 'friends', label: '🤝 友情链接' },
                { key: 'repo', label: '📦 代码仓库' },
                { key: 'host', label: '🌍 服务器域名' },
                { key: 'tools', label: '🔧 实用工具' },
            ];

            // DOM refs
            const $ = s => document.querySelector(s);
            const content = $('#content');
            const status = $('#status');
            const tabs = $('#tabs');
            const countSpan = $('#countDisplay');
            const detailSheet = $('#detailSheet');
            const detailPanel = $('#detailPanel');
            const detailContent = $('#detailContent');
            const closeDetailBtn = $('#closeDetail');
            const searchForm = $('#searchForm');
            const kwInput = $('#kw');
            const toast = $('#toast');

            let currentCategory = 'all';
            let currentData = [...DATA];
            let toastTimer = null;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            function copyText(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('✅ 复制成功：' + text);
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('✅ 复制成功：' + text);
                } catch (e) {
                    showToast('❌ 复制失败，请手动复制');
                }
                document.body.removeChild(ta);
            }

            // 渲染分类标签
            function renderTabs() {
                tabs.innerHTML = CATEGORIES.map(cat =>
                    `<button class="tab focusable ${cat.key === currentCategory ? 'active' : ''}" data-key="${cat.key}">${cat.label}</button>`
                ).join('');
                tabs.querySelectorAll('.tab').forEach(btn => {
                    btn.onclick = () => {
                        currentCategory = btn.dataset.key;
                        renderTabs();
                        renderCards();
                    };
                });
            }

            // 渲染卡片
            function renderCards() {
                const kw = kwInput.value.trim().toLowerCase();
                let filtered = DATA.filter(item => {
                    const matchCat = currentCategory === 'all' || item.category === currentCategory;
                    const matchKw = !kw || item.title.includes(kw) || item.desc.includes(kw) || item.url.includes(kw);
                    return matchCat && matchKw;
                });

                currentData = filtered;
                countSpan.textContent = filtered.length;

                if (filtered.length === 0) {
                    content.innerHTML = `<div class="empty">😅 没有找到匹配的资源，试试其他关键词吧</div>`;
                    return;
                }

                // 按分类分组显示（保持类似飞快的section风格）
                const groups = {};
                filtered.forEach(item => {
                    if (!groups[item.category]) groups[item.category] = [];
                    groups[item.category].push(item);
                });

                const catLabels = {
                    'tvbox': '📺 TVbox 接口',
                    'friends': '🤝 友情链接',
                    'repo': '📦 代码仓库',
                    'host': '🌍 服务器与域名',
                    'tools': '🔧 实用工具'
                };

                let html = '';
                for (const [cat, items] of Object.entries(groups)) {
                    html += `<section class="section"><div class="section-title"><h2>${catLabels[cat] || cat}</h2><span style="font-size:12px;color:var(--muted)">${items.length} 项</span></div><div class="grid">`;
                    items.forEach(item => {
                        html += `
                            <article class="card focusable" tabindex="0" data-id="${item.id}">
                                <div class="name">
                                    <span class="icon-box">${item.icon || '🔗'}</span>
                                    ${item.title}
                                    ${item.category === 'tvbox' ? '<span class="tag">接口</span>' : ''}
                                </div>
                                <div class="remark">${item.desc}</div>
                            </article>
                        `;
                    });
                    html += `</div></section>`;
                }
                content.innerHTML = html;

                // 绑定点击事件
                content.querySelectorAll('.card').forEach(card => {
                    card.onclick = () => {
                        const id = parseInt(card.dataset.id);
                        const item = DATA.find(d => d.id === id);
                        if (item) openDetail(item);
                    };
                    card.onkeydown = e => { if (e.key === 'Enter') card.click(); };
                });
            }

            // 打开详情弹窗
            function openDetail(item) {
                document.body.style.overflow = 'hidden';
                detailSheet.classList.add('active');

                const isTvbox = item.category === 'tvbox';
                const displayUrl = item.url.length > 50 ? item.url.slice(0, 50) + '…' : item.url;

                detailContent.innerHTML = `
                    <div class="detail-title">${item.icon || '🔗'} ${item.title}</div>
                    <div class="detail-desc">${item.desc}</div>
                    <div style="background:rgba(255,255,255,.05);padding:10px 14px;border-radius:12px;word-break:break-all;font-size:13px;color:var(--muted);margin-bottom:16px;">
                        📍 ${displayUrl}
                    </div>
                    <div class="detail-actions">
                        ${isTvbox ? `
                            <button class="btn copy-btn" id="detailCopyBtn">📋 复制接口地址</button>
                            <a href="${item.url}" target="_blank" rel="noopener" class="btn primary">🔗 打开链接</a>
                        ` : `
                            <a href="${item.url}" target="_blank" rel="noopener" class="btn primary" style="flex:2;">🔗 访问站点</a>
                            <button class="btn copy-btn" id="detailCopyBtn">📋 复制链接</button>
                        `}
                    </div>
                `;

                // 复制按钮逻辑
                const copyBtn = document.getElementById('detailCopyBtn');
                if (copyBtn) {
                    copyBtn.onclick = (e) => {
                        e.stopPropagation();
                        copyText(item.url);
                    };
                }

                // 关闭按钮
                closeDetailBtn.onclick = closeDetail;
                // 点击背景关闭
                detailSheet.onclick = (e) => {
                    if (e.target === detailSheet) closeDetail();
                };
                // ESC 关闭
                document.addEventListener('keydown', handleEsc);
            }

            function closeDetail() {
                document.body.style.overflow = '';
                detailSheet.classList.remove('active');
                document.removeEventListener('keydown', handleEsc);
            }

            function handleEsc(e) {
                if (e.key === 'Escape') closeDetail();
            }

            // 搜索提交
            function handleSearch(e) {
                e.preventDefault();
                renderCards();
            }

            // 初始化
            function init() {
                renderTabs();
                renderCards();
                searchForm.onsubmit = handleSearch;
                kwInput.oninput = () => renderCards(); // 实时搜索
                status.textContent = `✨ 共 ${DATA.length} 个资源`;
                countSpan.textContent = DATA.length;

                // 键盘全局 ESC
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && detailSheet.classList.contains('active')) {
                        closeDetail();
                    }
                });
            }

            init();

        })();
    </script>
</body>

</html>
